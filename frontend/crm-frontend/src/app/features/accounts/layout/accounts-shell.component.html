<div class="accounts-shell">

  <!-- =====================================================
       SIDEBAR
  ====================================================== -->

  <aside
    class="accounts-sidebar-wrapper"
    [class.mobile-open]="mobileSidebarOpen()"
  >
    <app-accounts-sidebar></app-accounts-sidebar>
  </aside>


  <!-- =====================================================
       MOBILE OVERLAY
  ====================================================== -->

  @if (mobileSidebarOpen()) {
    <button
      type="button"
      class="sidebar-overlay"
      aria-label="Close accounts menu"
      (click)="closeMobileSidebar()"
    ></button>
  }


  <!-- =====================================================
       MAIN WORKSPACE
  ====================================================== -->

  <div class="accounts-main">

    <!-- ===================================================
         TOP HEADER
    ==================================================== -->

    <header class="accounts-header">

      <div class="header-left">

        <!-- Mobile Menu Button -->

        <button
          type="button"
          class="mobile-menu-button"
          aria-label="Open accounts menu"
          (click)="toggleMobileSidebar()"
        >
          <span class="menu-line"></span>
          <span class="menu-line"></span>
          <span class="menu-line"></span>
        </button>


        <!-- Workspace Heading -->

        <div class="header-title">

          <div class="workspace-badge">
            Accounts
          </div>

          <div>
            <h1>
              Accounts & Finance
            </h1>

            <p>
              Manage accounting, ledgers, invoices,
              payments and financial reports
            </p>
          </div>

        </div>

      </div>


      <!-- =================================================
           HEADER RIGHT
      ================================================== -->

      <div class="header-right">

        <div class="financial-year">
          <span class="financial-year-label">
            Financial Year
          </span>

          <strong>
            2026–27
          </strong>
        </div>


        <!-- ===============================================
             CURRENT USER
        ================================================ -->

        <div class="account-user-menu-host">

          <button
            type="button"
            class="account-user-button"
            aria-label="Open account user menu"
            [attr.aria-expanded]="userMenuOpen()"
            (click)="toggleUserMenu()"
          >

            <span class="account-user-avatar">
              {{ userInitial() }}
            </span>


            <span class="account-user-copy">

              <strong>
                {{ userName() }}
              </strong>

              <small>
                {{ userDesignation() }}
              </small>

            </span>


            <span
              class="account-user-chevron"
              aria-hidden="true"
            >
              &#8964;
            </span>

          </button>


          @if (userMenuOpen()) {

            <div
              class="account-user-dropdown"
              role="menu"
            >

              <div class="account-user-dropdown-heading">

                <span class="dropdown-avatar">
                  {{ userInitial() }}
                </span>

                <div>
                  <strong>
                    {{ userName() }}
                  </strong>

                  <small>
                    {{ userDesignation() }}
                  </small>
                </div>

              </div>


              <div class="account-user-menu-divider"></div>


              <button
                type="button"
                class="account-user-menu-item"
                (click)="openProfile()"
              >
                <span aria-hidden="true">
                  &#9817;
                </span>
                My Profile
              </button>


              <button
                type="button"
                class="account-user-menu-item"
                (click)="openSettings()"
              >
                <span aria-hidden="true">
                  &#9881;
                </span>
                Settings
              </button>


              <div class="account-user-menu-divider"></div>


              <button
                type="button"
                class="account-user-menu-item logout"
                (click)="logout()"
              >
                <span aria-hidden="true">
                  &#8618;
                </span>
                Logout
              </button>

            </div>

          }

        </div>

      </div>

    </header>


    <!-- ===================================================
         PAGE CONTENT
    ==================================================== -->

    <main class="accounts-content">

      <div class="accounts-page-container">

        <router-outlet></router-outlet>

      </div>

    </main>

  </div>

</div>
