<aside
  class="purchase-sidebar"
  [class.purchase-sidebar--collapsed]="collapsed()"
>
  <!-- =========================================================
       COMPANY / BRAND
  ========================================================== -->

  <div class="purchase-sidebar__brand">

    <div class="purchase-sidebar__company-logo">

      <img
        *ngIf="companyLogoUrl(); else companyFallback"
        [src]="companyLogoUrl()"
        [alt]="companyName()"
      />

      <ng-template #companyFallback>
        <span>
          Opa
        </span>
      </ng-template>

    </div>


    <div
      class="purchase-sidebar__brand-copy"
      *ngIf="!collapsed()"
    >
      <h2>
        {{ companyName() }}
      </h2>

      <p>
        PURCHASE CRM
      </p>
    </div>


    <button
      type="button"
      class="purchase-sidebar__collapse"
      (click)="toggleSidebar()"
      [attr.aria-label]="
        collapsed()
          ? 'Expand purchase sidebar'
          : 'Collapse purchase sidebar'
      "
    >
      <span>
        {{ collapsed() ? '›' : '‹' }}
      </span>
    </button>

  </div>


  <!-- =========================================================
       EMPLOYEE PROFILE
  ========================================================== -->

  <section class="purchase-sidebar__employee">

    <div class="purchase-sidebar__employee-photo">

      <img
        *ngIf="employeePhotoUrl(); else employeeInitial"
        [src]="employeePhotoUrl()"
        [alt]="userName()"
      />

      <ng-template #employeeInitial>
        <span>
          {{ userInitial() }}
        </span>
      </ng-template>

    </div>


    <div
      class="purchase-sidebar__employee-copy"
      *ngIf="!collapsed()"
    >

      <strong>
        {{ userName() }}
      </strong>

      <span>
        {{ userDesignation() }}
      </span>

      <small *ngIf="employeeCode()">
        {{ employeeCode() }}
      </small>

    </div>

  </section>


  <!-- =========================================================
       MENU GROUPS
  ========================================================== -->

  <div class="purchase-sidebar__menu-area">

    <section
      class="purchase-sidebar__group"
      *ngFor="let group of menuGroups"
    >

      <div
        class="purchase-sidebar__group-title"
        *ngIf="!collapsed()"
      >
        {{ group.title }}
      </div>


      <nav
        class="purchase-sidebar__nav"
        [attr.aria-label]="group.title"
      >

        <button
          *ngFor="let item of group.items"
          type="button"
          class="purchase-sidebar__link"
          [class.purchase-sidebar__link--active]="
            isActive(item)
          "
          (click)="navigate(item.route)"
          [attr.title]="
            collapsed()
              ? item.label
              : null
          "
        >

          <span
            class="purchase-sidebar__icon"
            [attr.data-menu-id]="item.id"
          >
            {{ item.icon }}
          </span>


          <span
            class="purchase-sidebar__link-label"
            *ngIf="!collapsed()"
          >
            {{ item.label }}
          </span>


          <span
            class="purchase-sidebar__arrow"
            *ngIf="!collapsed()"
          >
            ›
          </span>

        </button>

      </nav>

    </section>

  </div>


  <!-- =========================================================
       LOGOUT
  ========================================================== -->

  <div class="purchase-sidebar__footer">

    <button
      type="button"
      class="purchase-sidebar__logout"
      (click)="logout()"
      [attr.title]="
        collapsed()
          ? 'Logout'
          : null
      "
    >

      <span class="purchase-sidebar__logout-icon">
        ↪
      </span>

      <span
        class="purchase-sidebar__logout-text"
        *ngIf="!collapsed()"
      >
        Logout
      </span>

    </button>

  </div>

</aside>
